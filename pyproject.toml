[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpilot"
dynamic = ["version"]
description = "Bounded GPU inference serving, distributed routing and reproducible experiments (MLX and CUDA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "prometheus-client>=0.21,<1"]

[project.optional-dependencies]
mlx = ["mlx>=0.32.4,<0.33", "mlx-lm>=0.32.2,<0.33"]
# Linux/NVIDIA worker. Deployments should install the locked requirements-cuda.txt instead.
cuda = ["torch==2.9.1", "transformers==5.20.1"]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
tensorpilot-server = "tensorpilot.server:main"
tensorpilot-load = "tensorpilot.load:main"
tensorpilot-experiment = "tensorpilot.experiment:main"
tensorpilot-compare = "tensorpilot.compare:main"
tensorpilot-bench = "tensorpilot.bench:main"
tensorpilot-recover = "tensorpilot.journal:main"
tensorpilot-profile = "tensorpilot.profile:main"
tensorpilot-soak = "tensorpilot.soak:main"
tensorpilot-correctness = "tensorpilot.correctness:main"
tensorpilot-supervisor = "tensorpilot.supervisor:main"
tensorpilot-matrix = "tensorpilot.matrix:main"
tensorpilot-kernel-capture = "tensorpilot.kernel_capture:main"
tensorpilot-control-plane = "tensorpilot.control_plane:main"
tensorpilot-data-plane = "tensorpilot.data_plane:main"
tensorpilot-cluster-compare = "tensorpilot.cluster_compare:main"
tensorpilot-cluster = "tensorpilot.cluster:main"
tensorpilot-scale-bench = "tensorpilot.scale_bench:main"
tensorpilot-synthetic-cluster = "tensorpilot.synthetic_cluster:main"
tensorpilot-gpu-preflight = "tensorpilot.gpu_preflight:main"
tensorpilot-gpu-bench = "tensorpilot.gpu_bench:main"

[tool.setuptools.dynamic]
version = {attr = "tensorpilot.__version__"}

[tool.setuptools.packages.find]
include = ["tensorpilot*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
