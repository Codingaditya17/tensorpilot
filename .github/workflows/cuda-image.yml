# Builds the Linux/CUDA image on a CPU-only runner and runs the CUDA-interface tests inside it.
# No GPU is used or claimed. Runs on manual dispatch, on pull requests that touch the image inputs,
# and on version tags, where it also publishes the image to GHCR. Nothing here deploys to Runpod:
# a GPU Pod is paid infrastructure and is started by a person following docs/v09-runpod-runbook.md.
name: CUDA image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/docker/**
      - requirements-cuda.*
      - tensorpilot/**
      - pyproject.toml
      - .github/workflows/cuda-image.yml
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: cuda-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-debian < deploy/docker/Dockerfile.cuda

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.cuda
          platforms: linux/amd64
          load: true
          push: false
          tags: tensorpilot-cuda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container identity and entrypoints
        run: |
          uid="$(docker run --rm --entrypoint id tensorpilot-cuda:ci -u)"
          test "$uid" = "10001"
          docker run --rm --entrypoint python tensorpilot-cuda:ci -c "import tensorpilot.cuda_backend, tensorpilot.readiness; import torch, transformers; print('torch', torch.__version__, 'transformers', transformers.__version__)"
          docker run --rm --entrypoint tensorpilot-server tensorpilot-cuda:ci --help > /dev/null

      - name: CUDA-interface tests on CPU inside the image
        run: |
          docker run --rm -v "$PWD/tests:/tests:ro" -v "$PWD/benchmarks:/benchmarks:ro" --entrypoint bash tensorpilot-cuda:ci -c '
            python -m pip install -q "pytest>=8,<10" &&
            cd /tmp &&
            python -m pytest -q -p no:cacheprovider \
              /tests/test_cuda_backend.py /tests/test_cuda_cluster.py /tests/test_graceful_shutdown.py \
              /tests/test_gpu_bench.py /tests/test_gpu_preflight.py /tests/test_gpu_telemetry.py \
              /tests/test_server_cli.py /tests/test_backend_contract.py /tests/test_readiness.py'

      - name: Preflight must refuse a runner without a GPU
        run: |
          set +e
          docker run --rm -e TENSORPILOT_API_KEY=ci-not-used --entrypoint tensorpilot-gpu-preflight \
            tensorpilot-cuda:ci --model Qwen/Qwen2.5-0.5B-Instruct \
            --revision 7ae557604adf67be50417f59c2c2f167def9a775 --skip-remote --skip-load \
            --output /tmp/preflight.json
          rc=$?
          set -e
          test "$rc" = "1"

      - name: Server must fail fast, not idle, without a GPU
        run: |
          set +e
          docker run --rm -e TENSORPILOT_API_KEY=ci-not-used tensorpilot-cuda:ci > /tmp/server.log 2>&1
          rc=$?
          set -e
          test "$rc" = "1"
          grep -q "PyTorch cannot see a CUDA device" /tmp/server.log

  publish:
    # Only for version tags. Pushes the same Dockerfile to GHCR; the image is unmeasured on a GPU.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name (registry names must be lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/cuda" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
