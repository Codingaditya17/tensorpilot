name: CPU service tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy-scripts:
    # Static checks for everything that runs on a rented Pod, so a typo is caught before billing starts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shell syntax and ShellCheck
        run: |
          for f in deploy/runpod/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning deploy/runpod/*.sh
      - name: Session scripts accept a valid environment in plan mode and refuse a bad one
        run: |
          export TENSORPILOT_API_KEY=a TENSORPILOT_CONTROL_API_KEY=b TENSORPILOT_DATA_API_KEY=c \
                 TENSORPILOT_MODEL=Qwen/Qwen2.5-0.5B-Instruct \
                 TENSORPILOT_REVISION=7ae557604adf67be50417f59c2c2f167def9a775
          deploy/runpod/session.sh --plan > /dev/null
          deploy/runpod/two_gpu_session.sh --plan > /dev/null
          env -u TENSORPILOT_API_KEY -u TENSORPILOT_CONTROL_API_KEY -u TENSORPILOT_DATA_API_KEY deploy/runpod/first-run.sh --plan > /dev/null
          ! TENSORPILOT_API_KEY=b deploy/runpod/session.sh --plan 2> /dev/null
          ! TENSORPILOT_REVISION=main deploy/runpod/two_gpu_session.sh --plan 2> /dev/null
      - name: Benchmark configs validate
        run: |
          python -m pip install -r requirements-service.txt
          for f in benchmarks/gpu/*.json; do python -m tensorpilot.gpu_bench plan "$f" > /dev/null; done
      - name: Compose file is valid
        run: TENSORPILOT_API_KEY=x docker compose -f deploy/docker/compose.cuda.yml config > /dev/null
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-service.txt
      - run: python -m ruff check tensorpilot tests
      - run: python -m pytest -q
  cuda-backend-cpu:
    timeout-minutes: 30
    # Exercises the CUDA backend and its cluster integration on CPU. No GPU is used or claimed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-service.txt transformers==5.20.1
      - run: python -m ruff check tensorpilot tests
      - run: python -m pytest -q tests/test_cuda_backend.py tests/test_cuda_cluster.py tests/test_graceful_shutdown.py tests/test_gpu_bench.py tests/test_gpu_preflight.py tests/test_gpu_telemetry.py tests/test_readiness.py
