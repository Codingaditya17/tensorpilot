name: CPU service tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-service.txt
      - run: python -m ruff check tensorpilot tests
      - run: python -m pytest -q
  cuda-backend-cpu:
    # Exercises the CUDA backend and its cluster integration on CPU. No GPU is used or claimed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-service.txt transformers==5.20.1
      - run: python -m ruff check tensorpilot tests
      - run: python -m pytest -q tests/test_cuda_backend.py tests/test_cuda_cluster.py tests/test_graceful_shutdown.py tests/test_gpu_bench.py tests/test_gpu_preflight.py
