# Builds the experiment Pod image (production worker image + SSH + session scripts + benchmark configs)
# and verifies it without a GPU. Publishes to GHCR only for `exp-v*` tags, a namespace that cannot
# trigger the production publish in cuda-image.yml (which listens for `v*`). Nothing here rents or
# starts Runpod infrastructure.
name: Experiment image
on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/docker/Dockerfile.experiment*
      - deploy/runpod/**
      - tensorpilot/**
      - requirements-cuda.txt
      - pyproject.toml
      - benchmarks/gpu/**
      - docs/v09-runpod-*.md
      - .github/workflows/experiment-image.yml
  push:
    tags: ['exp-v*']
permissions:
  contents: read
concurrency:
  group: experiment-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:latest-debian < deploy/docker/Dockerfile.experiment
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.experiment
          platforms: linux/amd64
          load: true
          push: false
          tags: tensorpilot-exp:ci
          build-args: SOURCE_SHA=${{ github.sha }}
      - name: Quantization, batching, harness and stage-runner tests against the image's own package (CPU, no GPU)
        run: |
          docker run --rm --user 0 -v "$PWD/tests:/repo/tests:ro" -v "$PWD/deploy:/repo/deploy:ro" \
            -v "$PWD/benchmarks:/repo/benchmarks:ro" -v "$PWD/requirements-cuda.txt:/repo/requirements-cuda.txt:ro" \
            -w /repo -e PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint bash tensorpilot-exp:ci -c '
              python -m pip install -q "pytest>=8,<10" &&
              python -m pytest -q -p no:cacheprovider tests/test_quantization.py tests/test_cuda_batch.py \
                tests/test_cuda_batch_engine.py tests/test_quality.py tests/test_gpu_bench_scale.py \
                tests/test_scale_session.py tests/test_fault_run.py tests/test_suite.py tests/test_telemetry.py'
      - name: Verify SSH hardening, permissions, evidence path and shutdown (no GPU)
        run: deploy/runpod/test-pod-image.sh tensorpilot-exp:ci --slow

  publish:
    if: startsWith(github.ref, 'refs/tags/exp-v')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference (lowercase; tag exp-v0.9.1-1 publishes :v0.9.1-1)
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/cuda-experiment" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#exp-}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.experiment
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          build-args: SOURCE_SHA=${{ github.sha }}
